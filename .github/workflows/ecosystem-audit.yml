name: ecosystem-audit

on:
  push:
    branches:
      - main
      - stable
      - nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STYIO_PYTHON_VERSION: "3.13.5"
    strategy:
      fail-fast: false
      matrix:
        target:
          - repo: SymPolicy/styio-benchmark
            path: styio-benchmark
            project: styio-benchmark
            ref: canary
          - repo: SymPolicy/styio-book
            path: styio-book
            project: styio-book
            ref: main
          - repo: SymPolicy/styio-dev-doc
            path: styio-dev-doc
            project: styio-dev-doc
            ref: main
          - repo: SymPolicy/styio-dev-env
            path: styio-dev-env
            project: styio-dev-env
            ref: main
          - repo: SymPolicy/styio-example
            path: styio-example
            project: styio-example
            ref: main
          - repo: SymPolicy/styio.io
            path: styio.io
            project: styio.io
            ref: main

    steps:
      - name: Checkout released styio-audit policy
        uses: actions/checkout@v5
        with:
          repository: SymPolicy/styio-audit
          ref: stable
          path: styio-audit

      - name: Checkout target repository
        if: matrix.target.path != 'styio-audit'
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.ref }}
          fetch-depth: 0
          path: ${{ matrix.target.path }}

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Run latest styio-audit gate
        run: |
          git -C styio-audit rev-parse HEAD
          git -C "${{ matrix.target.path }}" rev-parse HEAD
          for branch in release stable nightly; do
            git -C "${{ matrix.target.path }}" fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done
          python3 styio-audit/bin/styio-audit gate \
            --repo "${{ matrix.target.path }}" \
            --project "${{ matrix.target.project }}"

  audit-branch-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STYIO_PYTHON_VERSION: "3.13.5"
    strategy:
      fail-fast: false
      matrix:
        target:
          - { repo: SymPolicy/Styio, project: Styio, ref: release }
          - { repo: SymPolicy/Styio, project: Styio, ref: stable }
          - { repo: SymPolicy/Styio, project: Styio, ref: nightly }
          - { repo: SymPolicy/Pafio, project: Pafio, ref: release }
          - { repo: SymPolicy/Pafio, project: Pafio, ref: stable }
          - { repo: SymPolicy/Pafio, project: Pafio, ref: nightly }
          - { repo: SymPolicy/Vityo, project: Vityo, ref: release }
          - { repo: SymPolicy/Vityo, project: Vityo, ref: stable }
          - { repo: SymPolicy/Vityo, project: Vityo, ref: nightly }
          - { repo: SymPolicy/styio-all-in-one, project: styio-all-in-one, ref: main }
          - { repo: SymPolicy/styio-all-in-one, project: styio-all-in-one, ref: stable }
          - { repo: SymPolicy/styio-all-in-one, project: styio-all-in-one, ref: nightly }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: main }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: stable }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: nightly }
          - { repo: SymPolicy/styio-ext-vsc, project: styio-ext-vsc, ref: main }
          - { repo: SymPolicy/styio-ext-vsc, project: styio-ext-vsc, ref: stable }
          - { repo: SymPolicy/styio-ext-vsc, project: styio-ext-vsc, ref: nightly }
          - { repo: SymPolicy/Styio-Cloud, project: Styio-Cloud, ref: release }
          - { repo: SymPolicy/Styio-Cloud, project: Styio-Cloud, ref: stable }
          - { repo: SymPolicy/Styio-Cloud, project: Styio-Cloud, ref: nightly }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: main }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: stable }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: nightly }

    steps:
      - name: Checkout released styio-audit policy
        uses: actions/checkout@v5
        with:
          repository: SymPolicy/styio-audit
          ref: stable
          path: styio-audit

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.ref }}
          fetch-depth: 0
          path: target

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Run latest styio-audit gate
        run: |
          git -C styio-audit rev-parse HEAD
          git -C target rev-parse HEAD
          for branch in release stable nightly; do
            git -C target fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done
          python3 styio-audit/bin/styio-audit gate \
            --repo target \
            --project "${{ matrix.target.project }}"
