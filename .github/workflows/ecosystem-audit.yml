name: ecosystem-audit

on:
  push:
    branches:
      - main
      - stable
      - nightly
      - ai-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STYIO_PYTHON_VERSION: "3.13.5"
    strategy:
      fail-fast: false
      matrix:
        target:
          - repo: SymPolicy/styio-audit
            path: styio-audit
            project: styio-audit
          - repo: SymPolicy/styio-cloud
            path: styio-cloud
            project: styio-cloud

    steps:
      - name: Checkout released styio-audit policy
        uses: actions/checkout@v5
        with:
          repository: SymPolicy/styio-audit
          ref: stable
          path: styio-audit

      - name: Checkout target repository
        if: matrix.target.path != 'styio-audit'
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repo }}
          ref: ai-dev
          fetch-depth: 0
          path: ${{ matrix.target.path }}

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Run latest styio-audit gate
        run: |
          git -C styio-audit rev-parse HEAD
          git -C "${{ matrix.target.path }}" rev-parse HEAD
          for branch in stable nightly ai-dev; do
            git -C "${{ matrix.target.path }}" fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done
          python3 styio-audit/bin/styio-audit gate \
            --repo "${{ matrix.target.path }}" \
            --project "${{ matrix.target.project }}"

  audit-branch-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STYIO_PYTHON_VERSION: "3.13.5"
    strategy:
      fail-fast: false
      matrix:
        target:
          - { repo: SymPolicy/Styio, project: styio, ref: main }
          - { repo: SymPolicy/Styio, project: styio, ref: stable }
          - { repo: SymPolicy/Styio, project: styio, ref: nightly }
          - { repo: SymPolicy/Styio, project: styio, ref: ai-dev }
          - { repo: SymPolicy/pafio, project: pafio, ref: main }
          - { repo: SymPolicy/pafio, project: pafio, ref: stable }
          - { repo: SymPolicy/pafio, project: pafio, ref: nightly }
          - { repo: SymPolicy/pafio, project: pafio, ref: ai-dev }
          - { repo: SymPolicy/vityo, project: vityo, ref: main }
          - { repo: SymPolicy/vityo, project: vityo, ref: stable }
          - { repo: SymPolicy/vityo, project: vityo, ref: nightly }
          - { repo: SymPolicy/vityo, project: vityo, ref: ai-dev }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: main }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: stable }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: nightly }
          - { repo: SymPolicy/styio-audit, project: styio-audit, ref: ai-dev }
          - { repo: SymPolicy/styio-cloud, project: styio-cloud, ref: main }
          - { repo: SymPolicy/styio-cloud, project: styio-cloud, ref: stable }
          - { repo: SymPolicy/styio-cloud, project: styio-cloud, ref: nightly }
          - { repo: SymPolicy/styio-cloud, project: styio-cloud, ref: ai-dev }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: main }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: stable }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: nightly }
          - { repo: SymPolicy/styio-community, project: styio-community, ref: ai-dev }

    steps:
      - name: Checkout released styio-audit policy
        uses: actions/checkout@v5
        with:
          repository: SymPolicy/styio-audit
          ref: stable
          path: styio-audit

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.ref }}
          fetch-depth: 0
          path: target

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Run latest styio-audit gate
        run: |
          git -C styio-audit rev-parse HEAD
          git -C target rev-parse HEAD
          for branch in stable nightly ai-dev; do
            git -C target fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done
          python3 styio-audit/bin/styio-audit gate \
            --repo target \
            --project "${{ matrix.target.project }}"
